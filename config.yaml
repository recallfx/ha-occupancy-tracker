areas:
  # Indoor areas
  entrance:
    name: Entrance
    indoors: true
  garage:
    name: Garage
    indoors: true
  guest_room:
    name: Guest Toilet
    indoors: true
  workshop:
    name: Workshop
    indoors: true
  corridor_1:
    name: Corridor 1 (Front)
    indoors: true
    transition: true
  corridor_2:
    name: Corridor 2 (Back)
    indoors: true
    transition: true
  kitchen:
    name: Kitchen
    indoors: true
  dining_room:
    name: Dining Room
    indoors: true
  living:
    name: Living Room
    indoors: true
  study:
    name: Study
    indoors: true
  bedroom_2:
    name: Bedroom 2
    indoors: true
    profile: sleeping
  bathroom:
    name: Bathroom
    indoors: true
  bedroom_1:
    name: Bedroom 1
    indoors: true
    profile: sleeping
  utility_room:
    name: Utility Room
    indoors: true
  main_bedroom:
    name: Main Bedroom
    indoors: true
    profile: sleeping
  main_bathroom:
    name: Main Bathroom
    indoors: true
  wardrobe:
    name: Wardrobe
    indoors: true

  # Outdoor areas
  frontyard:
    name: Front Yard
    indoors: false
    exit_capable: true
  backyard:
    name: Back Yard
    indoors: false
    exit_capable: true
  left_side:
    name: Left Side
    indoors: false
    exit_capable: true
  right_side:
    name: Right Side
    indoors: false
    exit_capable: true

adjacency:
  # Outdoor connections
  frontyard: [entrance, garage, backyard, left_side, right_side]
  backyard: [entrance, kitchen, main_bedroom, frontyard, left_side, right_side]
  left_side: [frontyard, backyard, bedroom_1, utility_room]
  right_side: [frontyard, backyard, workshop]

  # Entrance area
  entrance: [frontyard, garage, guest_room, corridor_1, backyard, kitchen, workshop]
  garage: [entrance, frontyard, workshop]
  guest_room: [entrance]
  workshop: [entrance, garage, right_side]

  # Corridors
  corridor_1: [entrance, corridor_2, study, bedroom_2, bathroom]
  corridor_2: [corridor_1, bedroom_1, bedroom_2, main_bedroom, utility_room]

  # Open plan (all three adjacent — sensors overlap)
  kitchen: [entrance, dining_room, living, backyard]
  dining_room: [kitchen, living]
  living: [kitchen, dining_room]

  # Corridor 1 rooms
  study: [corridor_1]
  bedroom_2: [corridor_1, corridor_2]
  bathroom: [corridor_1]

  # Corridor 2 rooms
  bedroom_1: [corridor_2, left_side]
  utility_room: [corridor_2, left_side]

  # Main bedroom suite
  main_bedroom: [corridor_2, main_bathroom, wardrobe, backyard]
  main_bathroom: [main_bedroom]
  wardrobe: [main_bedroom]

sensors:
  # KNX Motion Sensors (5s OFF delay)
  binary_sensor.entrance_motion:
    area: entrance
    type: motion
  binary_sensor.garage_motion:
    area: garage
    type: motion
  binary_sensor.garage_pir:
    area: garage
    type: motion
  binary_sensor.guest_room_motion:
    area: guest_room
    type: motion
  binary_sensor.workshop_motion:
    area: workshop
    type: motion
  binary_sensor.workshop_pir:
    area: workshop
    type: motion
  binary_sensor.corridor_1_motion:
    area: corridor_1
    type: motion
  binary_sensor.corridor_2_motion:
    area: corridor_2
    type: motion
  binary_sensor.kitchen_motion:
    area: kitchen
    type: motion
  binary_sensor.dining_room_motion:
    area: dining_room
    type: motion
  binary_sensor.living_room_motion:
    area: living
    type: motion
  binary_sensor.study_motion:
    area: study
    type: motion
  binary_sensor.bedroom_2_motion:
    area: bedroom_2
    type: motion
  binary_sensor.bathroom_motion:
    area: bathroom
    type: motion
  binary_sensor.bedroom_1_motion:
    area: bedroom_1
    type: motion
  binary_sensor.utility_room_motion:
    area: utility_room
    type: motion
  binary_sensor.main_bedroom_motion:
    area: main_bedroom
    type: motion
  binary_sensor.main_bathroom_motion:
    area: main_bathroom
    type: motion
  binary_sensor.wardrobe_motion:
    area: wardrobe
    type: motion

  # Magnetic Sensors (doors/windows)
  binary_sensor.entrance_magnet:
    area: [entrance, frontyard]
    type: magnetic
  binary_sensor.corridor_magnet:
    area: [entrance, backyard]
    type: magnetic
  binary_sensor.sliding_door_magnet:
    area: [kitchen, backyard]
    type: magnetic
  binary_sensor.main_bedroom_magnet:
    area: [main_bedroom, backyard]
    type: magnetic
  binary_sensor.bathroom_magnet:
    area: [bathroom, backyard]
    type: magnetic
  binary_sensor.bedroom_1_magnet:
    area: [bedroom_1, left_side]
    type: magnetic
  binary_sensor.utility_magnet:
    area: [utility_room, left_side]
    type: magnetic
  binary_sensor.workshop_magnet:
    area: [workshop, right_side]
    type: magnetic
  binary_sensor.bedroom_2_magnet:
    area: [bedroom_2, frontyard]
    type: magnetic
  binary_sensor.study_magnet:
    area: [study, frontyard]
    type: magnetic

  # Camera Motion Sensors (0s instant OFF)
  binary_sensor.front_left_motion:
    area: frontyard
    type: camera_motion
  binary_sensor.front_left_person_detected:
    area: frontyard
    type: camera_person
  binary_sensor.front_motion:
    area: frontyard
    type: camera_motion
  binary_sensor.front_person_detected:
    area: frontyard
    type: camera_person
  binary_sensor.front_right_motion:
    area: frontyard
    type: camera_motion
  binary_sensor.front_right_person_detected:
    area: frontyard
    type: camera_person
  binary_sensor.doorbell_motion:
    area: frontyard
    type: camera_motion
  binary_sensor.doorbell_person_detected:
    area: frontyard
    type: camera_person
  binary_sensor.back_left_motion:
    area: backyard
    type: camera_motion
  binary_sensor.back_left_person_detected:
    area: backyard
    type: camera_person
  binary_sensor.back_right_motion:
    area: backyard
    type: camera_motion
  binary_sensor.back_right_person_detected:
    area: backyard
    type: camera_person
  binary_sensor.left_motion:
    area: left_side
    type: camera_motion
  binary_sensor.left_person_detected:
    area: left_side
    type: camera_person
  binary_sensor.right_motion:
    area: right_side
    type: camera_motion
  binary_sensor.right_person_detected:
    area: right_side
    type: camera_person

open_plan_groups:
  open_plan:
    areas: [kitchen, dining_room, living]
