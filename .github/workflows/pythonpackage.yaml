name: Python package

on:
  push:
  pull_request:
  # schedule:
  #   - cron: "30 16 * * WED"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Run ruff linter
        run: |
          uv run ruff check .

      - name: Run ruff formatter check
        run: |
          uv run ruff format --check .

      - name: Run pytest
        run: |
          uv run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}

  production-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
      - name: Test against the Home Assistant version running in production
        # Keep this pinned to whatever `ha core info` reports on the host.
        run: >-
          uv run --isolated --no-project --python 3.14
          --with 'homeassistant==2026.8.3'
          --with 'pytest>=8.3.3'
          --with 'pytest-asyncio>=0.24.0'
          --with 'pytest-homeassistant-custom-component>=0.13.45'
          --with 'syrupy>=4.0.0'
          --with 'pyyaml>=6.0'
          pytest tests/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}
